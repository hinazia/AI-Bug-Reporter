name: Health Check

on:
    workflow_dispatch:
    schedule:
        - cron: '0 */12 * * *'

jobs:
    health-check-job:
        env:
            DOCKER_USERNAME: ${{vars.DOCKER_USERNAME}}
        runs-on: ubuntu-latest
        steps:

            - name: Code checkout
              uses: actions/checkout@v6
              
            - name: Pull your latest Docker image
              run:  docker compose pull 

            - name: Run the container in detached mode
              run:  docker compose up -d 
              
            - name: Curl to health check and Print Passed or failed
              run: |
                sleep 5
                curl -f  http://localhost:3000/health && echo "Health Check Passed" || { echo "Health Check failed"; exit 1; }

            - name: Stop and remove the container
              run: docker compose down

            - name: Summary of the Workflow
              run: |
                echo "## Health Check Report" >> $GITHUB_STEP_SUMMARY
                echo "- Image: ${{vars.DOCKER_USERNAME}}/repo:latest" >> $GITHUB_STEP_SUMMARY
                echo "- Status: PASSED" >> $GITHUB_STEP_SUMMARY
                echo "- Time: $(date)" >> $GITHUB_STEP_SUMMARY
