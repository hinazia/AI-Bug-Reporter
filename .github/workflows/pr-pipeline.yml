name: PR Pipeline

on:
    pull_request:
        branches: [main]
        types: [opened, synchronize]

permissions:
    contents: read
    pull-requests: write

jobs:
    build-test:
        uses: ./.github/workflows/reusable-build-test.yml
        with:
            run_tests: true
    
    pr-comment:
        runs-on: ubuntu-latest
        needs: build-test
        steps:
            - name: "PR checks passed for branch: <branch>"
              run: 'echo "PR checks passed for branch: ${{ github.head_ref}}"'


