name: Resuable Docker

on: 
    workflow_call:
        inputs:
            image_name: 
                type: string
            tag:
                type: string

        secrets:
            docker_token:
                required: true

        outputs:
            image-url:
                value: ${{jobs.set_output.outputs.image_url}}

jobs:
    code-docker:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v6

            - name: Short SHA
              id: sha-id
              run: echo "sha=${{ github.sha }} | cut -c1-7" >> "$GITHUB_OUTPUT"

            - name: Login To Docker Hub
              uses: docker/login-action@v4
              with:
                username: ${{ vars.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_TOKEN }}

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4
              with:
                driver: docker-container

            - name: Build and Push the Image
              uses: docker/build-push-action@v7
              with:
                context: .
                tags: |
                    ${{vars.DOCKER_USERNAME}}/repo:latest
                    ${{vars.DOCKER_USERNAME}}/repo:${{ steps.sha-id.outputs.sha}}

    set_output:
        runs-on: ubuntu-latest
        outputs:
            image_url: ${{steps.image-id.outputs.url}}
        steps:
            - name: Image URL
              id: image-id
              run: echo "url=${{vars.DOCKER_USERNAME}}/repo:latest"